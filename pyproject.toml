[project]
name = "k8sholmes"
dynamic = ["version"]
description = "A self-hosted platform for investigating Kubernetes environments: gated investigative capabilities, evidence with coverage, findings that cite it, organizational knowledge and accepted exceptions, reports computed from records, and your own OpenAI-compatible model."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bahman Shadmehr", email = "info@bshadmehr.me" }]
keywords = ["kubernetes", "investigation", "troubleshooting", "reliability", "sre", "devops", "kubectl", "llm", "tool-calling"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",   # every record and every capability input (design §2, §5.1)
]

[project.scripts]
k8sholmes = "k8sholmes.cli:main"

[dependency-groups]
# Development tools (PEP 735): installed by `uv sync`, never published as an extra.
dev = [
    "pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "hypothesis>=6.100",
    "ruff>=0.6", "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://github.com/bshadmehr98/k8sholmes"
Repository = "https://github.com/bshadmehr98/k8sholmes"
Issues = "https://github.com/bshadmehr98/k8sholmes/issues"
Changelog = "https://github.com/bshadmehr98/k8sholmes/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/k8sholmes/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/k8sholmes"]

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "docs/", "examples/", "design/", "README.md", "CONTRIBUTING.md", "AGENTS.md",
    "LICENSE", "CHANGELOG.md", "pyproject.toml",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "C4", "DTZ", "PL", "C90"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "PT018", "E501", "PLC0415"]
"examples/**" = ["S101", "S108", "PT018", "T201"]
"src/k8sholmes/testing/cluster.py" = ["S101"]  # the contract checker asserts by design
"src/k8sholmes/store.py" = ["S608"]  # table and column names come from the TABLES constant, values are bound
"src/k8sholmes/errors.py" = ["N818"]  # ClusterUnreachable, PermissionRefused … are the public names

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not cluster and not hosted'"
timeout = 120
markers = [
    "e2e: acceptance-case tests (run by default)",
    "cluster: tests against a real local cluster (kind or minikube); run by hand, see CONTRIBUTING.md",
    "hosted: a real model call; needs an API key in the environment; run by hand",
    "slow: slower than 5 s",
]

[tool.coverage.run]
branch = true
source = ["src/k8sholmes"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
