# The demo shop on a real cluster (design §17.2): the same names and planted conditions as the recording.
# api: OOM-killed under a tiny limit (scenario 1). web: a LoadBalancer Service, no NetworkPolicy
# (scenario 3). worker: no probes, no limits, a :latest tag, one replica. scheduler: one replica, no
# PodDisruptionBudget (scenario 4). legacy-export: a Service whose selector matches no pod (scenario 2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
  annotations:
    kubernetes.io/change-cause: "raise the cache size"
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          # allocate more than the limit allows, so the kernel OOM-kills the container and it restarts
          command: ["python", "-c", "x = bytearray(200 * 1024 * 1024); import time; time.sleep(3600)"]
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 48Mi, cpu: 200m}
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.9
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi, cpu: 100m}
          livenessProbe:
            exec: {command: ["/pause", "--version"]}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            exec: {command: ["/pause", "--version"]}
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: LoadBalancer
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {app: worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: registry.k8s.io/pause:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels: {app: scheduler}
spec:
  replicas: 1
  selector:
    matchLabels: {app: scheduler}
  template:
    metadata:
      labels: {app: scheduler}
    spec:
      containers:
        - name: scheduler
          image: registry.k8s.io/pause:3.9
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi, cpu: 100m}
          livenessProbe:
            exec: {command: ["/pause", "--version"]}
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-export
spec:
  selector: {app: legacy-export-v1}   # nothing carries this label any more
  ports:
    - port: 80
      targetPort: 8080
